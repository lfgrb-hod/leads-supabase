name: Atualizar dados

on:
  schedule:
    - cron: "0 9,16 * * *"   # 6h e 13h de Brasília (o cron do GitHub usa UTC)
  workflow_dispatch:         # permite rodar manualmente na aba Actions

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Exportar leads do Supabase
        run: node scripts/export.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leads.js
          if git diff --staged --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "dados: atualização automática"
            git pull --rebase
            git push
          fi
